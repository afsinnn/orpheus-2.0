<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orpheus - YouTube to MP3</title>
    <!-- FFmpeg WASM for high-quality conversion -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <style>
        :root {
            --bg: #12161D;
            --card: #1A202C;
            --text: #E2E8F0;
            --accent: #63B3ED;
            --amber: #FFB547;
            --danger: #FF6B7A;
            --r: 14px;
            --pad: 10px;
            font-family: "Space Grotesk", system-ui, sans-serif;
            color-scheme: dark;
        }
        * { box-sizing: border-box; margin: 0; }
        html, body { height: 100%; color: var(--text); background: var(--bg); }
        button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
        main { position: relative; z-index: 1; flex: 1; overflow-y: auto; padding: 20px 18px 150px; max-width: 720px; width: 100%; margin: 0 auto; }
        h1 { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 4px; }
        h2 { font-size: 18px; font-weight: 700; margin: 26px 0 10px; }
        .sub { color: var(--text); opacity: 0.7; font-size: 14px; }
        .row { display: flex; align-items: center; gap: 12px; padding: var(--pad) 12px; border-radius: var(--r); background: var(--card); margin-bottom: 8px; }
        .row .meta { flex: 1; min-width: 0; }
        .row .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ico { width: 40px; height: 40px; border-radius: 10px; background: var(--card); display: grid; place-items: center; flex: none; font-size: 16px; }
        .btn { background: var(--accent); color: #fff; padding: 10px 16px; border-radius: 999px; font-weight: 700; }
        .btn.ghost { background: var(--card); color: var(--text); }
        .btn.sm { padding: 6px 12px; font-size: 13px; }
        .small { padding: 6px 10px; border-radius: 8px; background: var(--card); font-size: 13px; }
        dialog { background: var(--card); color: var(--text); border: 0; border-radius: 20px; padding: 20px; width: min(92vw, 460px); max-height: 85vh; overflow: auto; }
        dialog::backdrop { background: rgba(0,0,0,.6); }
        input[type=text], select { width: 100%; background: var(--card); border: 1px solid #2f3949; border-radius: 10px; padding: 10px 12px; color: var(--text); font: inherit; margin: 6px 0 12px; }
        .prog { height: 6px; border-radius: 3px; background: var(--card); overflow: hidden; margin: 6px 0; }
        .prog i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }
        .empty { color: var(--text); opacity: 0.5; text-align: center; padding: 30px 10px; }
        @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        dialog[open] { animation: pop .18s ease-out; }
    </style>
</head>
<body>
<main id="view"></main>
<dialog id="dlg"></dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmt = s => isFinite(s) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '0:00';
function toast(m) { const t = document.createElement('div'); t.textContent = m; t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:8px 16px;border-radius:20px;z-index:99;font-weight:bold;'; document.body.appendChild(t); setTimeout(() => t.remove(), 2000); }

// --- DB Setup ---
const DB_NAME = 'orpheus_mp3';
let db;
function openDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = e => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('tracks')) {
                db.createObjectStore('tracks', { keyPath: 'id' });
            }
        };
        request.onsuccess = e => { db = e.target.result; resolve(db); };
        request.onerror = e => reject(e.target.error);
    });
}

async function getAllTracks() {
    await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction('tracks', 'readonly');
        const store = tx.objectStore('tracks');
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}

async function saveTrack(track) {
    await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction('tracks', 'readwrite');
        const store = tx.objectStore('tracks');
        const req = store.put(track);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
    });
}

async function deleteTrack(id) {
    await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction('tracks', 'readwrite');
        const store = tx.objectStore('tracks');
        const req = store.delete(id);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
    });
}

// --- UI Helpers ---
const dlg = $('#dlg');
function openDlg(html) { dlg.innerHTML = html; dlg.showModal(); }
function closeDlg() { dlg.close(); }

// --- YouTube Search & Convert ---
async function searchYouTube(query) {
    // Using Invidious API (no key required)
    try {
        const response = await fetch(`https://vid.puffyan.us/api/v1/search?q=${encodeURIComponent(query)}&type=video`);
        if (!response.ok) throw new Error('Search failed');
        const data = await response.json();
        return data.filter(item => item.type === 'video').map(item => ({
            id: item.videoId,
            title: item.title,
            artist: item.author,
            thumbnail: item.videoThumbnails?.[0]?.url || '',
            duration: item.lengthSeconds
        }));
    } catch (e) {
        console.error('YouTube search error:', e);
        return [];
    }
}

async function downloadVideoBlob(videoId) {
    // Using a free API to get the direct video URL
    try {
        const response = await fetch(`https://api.vevioz.com/api/video/download/${videoId}`);
        const data = await response.json();
        if (data.status !== 'success') throw new Error('Download link generation failed');
        
        // Get the best quality video stream
        const videoStream = data.data.streams.find(s => s.extension === 'mp4' && s.quality === 'high') 
                             || data.data.streams.find(s => s.extension === 'mp4');
        
        if (!videoStream) throw new Error('No suitable video stream found');
        
        const res = await fetch(videoStream.url);
        if (!res.ok) throw new Error('Failed to fetch video');
        return await res.blob();
    } catch (e) {
        console.error('Video download error:', e);
        throw e;
    }
}

async function convertToMp3(blob) {
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({ log: false });
    
    await ffmpeg.load();
    
    const inputName = 'input.mp4';
    const outputName = 'output.mp3';
    
    ffmpeg.FS('writeFile', inputName, await fetchFile(blob));
    
    await ffmpeg.run('-i', inputName, '-vn', '-acodec', 'libmp3lame', '-q:a', '2', outputName);
    
    const data = ffmpeg.FS('readFile', outputName);
    return new Blob([data.buffer], { type: 'audio/mpeg' });
}

async function handleConvert(videoId, title, artist) {
    openDlg(`<h2>Converting...</h2><p class="sub">Please wait while we fetch and convert the video.</p><div id="conv-status"></div>`);
    
    try {
        $('#conv-status').textContent = 'Fetching video...';
        const videoBlob = await downloadVideoBlob(videoId);
        
        $('#conv-status').textContent = 'Converting to MP3...';
        const mp3Blob = await convertToMp3(videoBlob);
        
        const track = {
            id: uid(),
            title: title.replace(/[^a-zA-Z0-9\s]/g, ''),
            artist: artist || 'Unknown Artist',
            created: Date.now(),
            blob: mp3Blob,
            duration: 0 // We'll approximate or leave it out
        };
        
        await saveTrack(track);
        $('#conv-status').innerHTML = `<button class="btn" id="download-btn">Download MP3</button>`;
        $('#download-btn').onclick = () => {
            const url = URL.createObjectURL(mp3Blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${track.title}.mp3`;
            a.click();
            URL.revokeObjectURL(url);
        };
    } catch (e) {
        $('#conv-status').innerHTML = `<p style="color:var(--danger)">Error: ${e.message}</p><button class="btn ghost" onclick="closeDlg()">Close</button>`;
    }
}

function openYouTubeConverter() {
    openDlg(`
        <h2>YouTube to MP3</h2>
        <input type="text" id="yt-search" placeholder="Search YouTube..." autofocus>
        <button class="btn" id="yt-go">Search</button>
        <div id="yt-results" style="margin-top:16px; max-height:40vh; overflow-y:auto;"></div>
    `);
    
    $('#yt-go').onclick = async () => {
        const query = $('#yt-search').value.trim();
        if (!query) return;
        
        $('#yt-results').innerHTML = '<p class="sub">Searching...</p>';
        const results = await searchYouTube(query);
        
        if (results.length === 0) {
            $('#yt-results').innerHTML = '<p class="sub">No results found.</p>';
            return;
        }
        
        $('#yt-results').innerHTML = results.map(item => `
            <div class="row" style="cursor:pointer">
                <img src="${item.thumbnail}" style="width:60px;height:45px;object-fit:cover;border-radius:6px;">
                <div class="meta">
                    <div class="t">${esc(item.title)}</div>
                    <div class="sub">${esc(item.artist)} · ${fmt(item.duration)}</div>
                </div>
                <button class="btn sm" data-id="${item.id}" data-title="${esc(item.title)}" data-artist="${esc(item.artist)}">Convert</button>
            </div>
        `).join('');
        
        document.querySelectorAll('[data-id]').forEach(btn => {
            btn.onclick = (e) => {
                e.stopPropagation();
                const id = btn.dataset.id;
                const title = btn.dataset.title;
                const artist = btn.dataset.artist;
                handleConvert(id, title, artist);
            };
        });
    };
}

// --- Render Home ---
function renderHome() {
    getAllTracks().then(tracks => {
        const view = $('#view');
        view.innerHTML = `
            <h1>Orpheus</h1>
            <p class="sub">Your personal music library</p>
            <div style="margin-top:20px">
                <button class="btn" id="yt-convert">🎵 YouTube Converter</button>
            </div>
            <h2>Your Library (${tracks.length})</h2>
            ${tracks.length === 0 ? '<p class="empty">No tracks yet. Use the YouTube converter to add some!</p>' : 
                tracks.sort((a,b) => b.created - a.created).map(t => `
                    <div class="row">
                        <div class="meta">
                            <div class="t">${esc(t.title)}</div>
                            <div class="sub">${esc(t.artist)}</div>
                        </div>
                        <button class="small" onclick="deleteTrack('${t.id}').then(()=>renderHome())">Delete</button>
                    </div>
                `).join('')}
        `;
        
        $('#yt-convert').onclick = openYouTubeConverter;
    }).catch(err => {
        $('#view').innerHTML = `<p class="empty">Error loading database: ${err.message}</p>`;
    });
}

// Initialize
document.addEventListener('DOMContentLoaded', renderHome);
</script>
</body>
</html>
