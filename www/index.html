<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161D">
<title>Orpheus</title>
<script src="lame.min.js"></script>
<style>
:root{--bg:#12161D;--panel:#1B212B;--panel2:#242C38;--ink:#EEF1F6;--mute:#8E99AB;--accent:#7C6CFF;--amber:#FFB547;--danger:#FF6B7A;--r:14px;--pad:10px;
  font-family:"Space Grotesk",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;color:var(--ink)}
html{background:var(--bg)}
#wall{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;pointer-events:none}
.mark{font-size:11px;letter-spacing:.12em;color:var(--mute)}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
main{position:relative;z-index:1;flex:1;overflow-y:auto;padding:20px 18px 150px;max-width:720px;width:100%;margin:0 auto}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
h2{font-size:18px;font-weight:700;margin:26px 0 10px}
.sub{color:var(--mute);font-size:14px}
.row{display:flex;align-items:center;gap:12px;padding:var(--pad) 12px;border-radius:var(--r);background:var(--panel);margin-bottom:8px}
.row .meta{flex:1;min-width:0}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{color:var(--mute);font-size:13px}
.ico{width:40px;height:40px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;flex:none;font-size:16px}
.btn{background:var(--accent);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700}
.btn.ghost{background:var(--panel2);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:13px}
.small{padding:6px 10px;border-radius:8px;background:var(--panel2);font-size:13px}
.wrap{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 55%,#000),var(--accent) 60%,var(--amber));border-radius:20px;padding:20px;color:#fff}
.wrap .big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:6px 0}
.wrap .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.wrap .grid div{background:rgba(0,0,0,.22);border-radius:12px;padding:10px}
.wrap .grid b{display:block;font-size:20px}
.wrap .grid span{font-size:12px;opacity:.85}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.card{flex:none;width:130px;background:var(--panel);border-radius:var(--r);padding:10px}
.card .ico{width:100%;height:90px;margin-bottom:8px;font-size:26px}
.card .t{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);padding-bottom:env(safe-area-inset-bottom,0);border-top:1px solid var(--panel2);z-index:5}
nav button{flex:1;padding:12px 0 10px;color:var(--mute);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:20px}
nav button.on{color:var(--ink)}
nav button.on .i{color:var(--accent)}
#player{position:fixed;left:10px;right:10px;bottom:calc(64px + env(safe-area-inset-bottom,0));background:var(--panel2);border-radius:var(--r);padding:10px 12px;display:none;z-index:4;max-width:700px;margin:0 auto}
#player.show{display:block}
#player .pr{display:flex;align-items:center;gap:10px}
#player .meta{flex:1;min-width:0}
#bar{width:100%;margin-top:8px;accent-color:var(--accent)}
dialog{background:var(--panel);color:var(--ink);border:0;border-radius:20px;padding:20px;width:min(92vw,460px);max-height:85vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
input[type=text],input[type=password],select{width:100%;background:var(--panel2);border:1px solid #2f3949;border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit;margin:6px 0 12px}
.drop{display:block;border:2px dashed #3a4558;border-radius:var(--r);padding:22px;text-align:center;color:var(--mute);margin:10px 0;cursor:pointer}
.prog{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.links a{color:var(--ink);background:var(--panel2);padding:5px 10px;border-radius:8px;font-size:13px;text-decoration:none}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:500;z-index:20}
@media (prefers-reduced-motion:no-preference){dialog[open]{animation:pop .18s ease-out}@keyframes pop{from{transform:scale(.96);opacity:0}}}
</style>
<style id="usercss"></style>
</head>
<body>
<div id="wall"></div>
<main id="view"></main>

<div id="player">
  <div class="pr">
    <div class="meta"><div class="t" id="pt" style="font-weight:500"></div><div class="a sub" id="pa"></div></div>
    <button class="small" id="prev" aria-label="Previous">⏮</button>
    <button class="small" id="pp" aria-label="Play or pause">▶</button>
    <button class="small" id="next" aria-label="Next">⏭</button>
  </div>
  <input type="range" id="bar" min="0" max="100" value="0" step="0.1" aria-label="Seek">
</div>

<nav>
  <button data-tab="home" class="on"><span class="i">⌂</span>Home</button>
  <button data-tab="playlists"><span class="i">☰</span>Playlists</button>
  <button data-tab="library"><span class="i">♫</span>Library</button>
</nav>

<dialog id="dlg"></dialog>
<audio id="audio" preload="metadata"></audio>

<script>
/* ---------- tiny helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => new Date().toISOString().slice(0, 10);
const fmt = s => isFinite(s) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '0:00';
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.append(t); setTimeout(() => t.remove(), 2200); }

/* ---------- storage: MP3 blobs in IndexedDB, small data in localStorage ---------- */
const DB = new Promise((res, rej) => {
  const r = indexedDB.open('tapebox', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('tracks', { keyPath: 'id' });
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
const tx = async (mode, fn) => { const db = await DB; return new Promise((res, rej) => { const t = db.transaction('tracks', mode); const rq = fn(t.objectStore('tracks')); t.oncomplete = () => res(rq?.result); t.onerror = () => rej(t.error); }); };
const dbAll = () => tx('readonly', s => s.getAll());
const dbPut = t => tx('readwrite', s => s.put(t));
const dbDel = id => tx('readwrite', s => s.delete(id));
const ls = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));

let tracks = [];                 // {id,title,artist,duration,created,blob}
let playlists = ls('playlists', []);   // {id,name,ids:[]}
let plays = ls('plays', []);           // {id,t}
const byId = id => tracks.find(t => t.id === id);

/* ---------- player ---------- */
const audio = $('#audio'); let queue = [], qi = 0, curUrl = null;
function playQueue(ids, i = 0) { queue = ids.filter(byId); qi = i; if (queue.length) loadCurrent(); }
function loadCurrent() {
  const t = byId(queue[qi]); if (!t) return;
  if (curUrl) URL.revokeObjectURL(curUrl);
  curUrl = URL.createObjectURL(t.blob); audio.src = curUrl; audio.play();
  $('#pt').textContent = t.title; $('#pa').textContent = t.artist || 'Unknown artist';
  $('#player').classList.add('show');
  plays.push({ id: t.id, t: Date.now() }); plays = plays.slice(-5000); save('plays', plays);
  if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist || '' });
}
audio.onended = () => { if (qi < queue.length - 1) { qi++; loadCurrent(); } };
audio.ontimeupdate = () => { $('#bar').value = audio.duration ? audio.currentTime / audio.duration * 100 : 0; };
const nativeMusic = () => (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && window.Capacitor.Plugins && window.Capacitor.Plugins.Music) || null;
let stopTimer = null;
audio.onplay = () => {
  $('#pp').textContent = '⏸'; clearTimeout(stopTimer);
  const t = byId(queue[qi]); try { nativeMusic()?.start({ title: t?.title || 'Orpheus', text: t?.artist || 'Playing' }); } catch {}
};
audio.onpause = () => {
  $('#pp').textContent = '▶'; clearTimeout(stopTimer);
  stopTimer = setTimeout(() => { if (audio.paused) { try { nativeMusic()?.stop(); } catch {} } }, 20000);   // keep the background service alive between tracks
};
try {
  if ('mediaSession' in navigator) {
    const ms = navigator.mediaSession;
    ms.setActionHandler('play', () => audio.play()); ms.setActionHandler('pause', () => audio.pause());
    ms.setActionHandler('nexttrack', () => $('#next').click()); ms.setActionHandler('previoustrack', () => $('#prev').click());
  }
} catch {}
$('#bar').oninput = e => { if (audio.duration) audio.currentTime = e.target.value / 100 * audio.duration; };
$('#pp').onclick = () => audio.paused ? audio.play() : audio.pause();
$('#next').onclick = () => { if (qi < queue.length - 1) { qi++; loadCurrent(); } };
$('#prev').onclick = () => { if (audio.currentTime > 3 || qi === 0) audio.currentTime = 0; else { qi--; loadCurrent(); } };

/* ---------- dialog helper ---------- */
const dlg = $('#dlg');
function openDlg(html) { dlg.innerHTML = html; if (!dlg.open) dlg.showModal(); }
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

/* ---------- tabs ---------- */
let tab = 'home', openPlaylist = null;
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab; openPlaylist = null;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
function render() { ({ home: renderHome, library: renderLibrary, playlists: renderPlaylists })[tab](); }

/* ---------- stats (daily wrap) ---------- */
function statsFor(list) {
  const cnt = {}; list.forEach(p => cnt[p.id] = (cnt[p.id] || 0) + 1);
  const ranked = Object.entries(cnt).filter(([id]) => byId(id)).sort((a, b) => b[1] - a[1]);
  const artists = {}; list.forEach(p => { const t = byId(p.id); if (t?.artist) artists[t.artist] = (artists[t.artist] || 0) + 1; });
  const topArtist = Object.entries(artists).sort((a, b) => b[1] - a[1])[0];
  const secs = list.reduce((n, p) => n + (byId(p.id)?.duration || 0), 0);
  return { ranked, topArtist: topArtist?.[0], count: list.length, mins: Math.round(secs / 60) };
}
function streak() {
  const days = new Set(plays.map(p => new Date(p.t).toISOString().slice(0, 10))); let n = 0, d = new Date();
  while (days.has(d.toISOString().slice(0, 10))) { n++; d.setDate(d.getDate() - 1); } return n;
}
const rowHtml = (t, extra = '') => `<div class="row"><div class="ico">♪</div><div class="meta"><div class="t">${esc(t.title)}</div><div class="a">${esc(t.artist || 'Unknown artist')} · ${fmt(t.duration)}</div></div>${extra}</div>`;

/* ---------- HOME ---------- */
function renderHome() {
  const todays = plays.filter(p => new Date(p.t).toISOString().slice(0, 10) === today());
  const s = statsFor(todays), all = statsFor(plays);
  const topTrack = s.ranked[0] && byId(s.ranked[0][0]);
  const last = [...new Map([...plays].reverse().map(p => [p.id, p])).values()].map(p => byId(p.id)).filter(Boolean).slice(0, 10);
  const most = all.ranked.slice(0, 10).map(([id, n]) => ({ t: byId(id), n }));
  const secWrap = `<h2>Your day, wrapped</h2>
    <div class="wrap">
      <div class="sub" style="color:#ffffffcc">Refreshes every day</div>
      <div class="big">${topTrack ? esc(topTrack.title) : 'Nothing played yet today'}</div>
      <div style="opacity:.9">${s.topArtist ? 'Top artist: ' + esc(s.topArtist) : 'Play something from your library to start today’s wrap.'}</div>
      <div class="grid"><div><b>${s.count}</b><span>plays</span></div><div><b>${s.mins}</b><span>minutes</span></div><div><b>${streak()}</b><span>day streak</span></div></div>
    </div>`;
  const secLast = `<h2>Last listened</h2>
    ${last.length ? `<div class="hscroll">${last.map(t => `<button class="card" data-play="${t.id}"><div class="ico">♪</div><div class="t">${esc(t.title)}</div><div class="a sub">${esc(t.artist || '')}</div></button>`).join('')}</div>` : '<div class="empty">Songs you play will show up here.</div>'}`;
  const secMost = `<h2>Most listened</h2>
    ${most.length ? most.map(({ t, n }) => rowHtml(t, `<span class="sub">${n}×</span><button class="small" data-play="${t.id}">Play</button>`)).join('') : '<div class="empty">Your top tracks will appear after a few plays.</div>'}`;
  const show = k => !theme.hide.includes(k);
  $('#view').innerHTML = `
    <div class="top"><div><h1>Home</h1><div class="sub">${new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' })}</div></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><span class="mark">By Afsin</span><div style="display:flex;gap:6px;align-items:center"><button class="small" id="cust" aria-label="Customize">🎨</button><button class="btn sm" id="ai">🔎 Find free music</button></div></div></div>
    ${show('wrap') ? secWrap : ''}${show('last') ? secLast : ''}${show('most') ? secMost : ''}`;
  $('#ai').onclick = openSearch; $('#cust').onclick = openCustomize;
  document.querySelectorAll('[data-play]').forEach(b => b.onclick = () => playQueue([b.dataset.play]));
}

/* ---------- LIBRARY ---------- */
function renderLibrary() {
  const list = [...tracks].sort((a, b) => b.created - a.created);
  $('#view').innerHTML = `
    <div class="top"><div><h1>Library</h1><div class="sub">${list.length} MP3${list.length === 1 ? '' : 's'} on this device</div></div>
      <button class="btn sm" id="conv">+ Convert</button></div>
    <div style="margin-top:16px">${list.length ? list.map(t => rowHtml(t, `<button class="small" data-play="${t.id}">▶</button><button class="small" data-menu="${t.id}" aria-label="More">⋯</button>`)).join('')
      : '<div class="empty">Nothing here yet.<br>Tap Convert to turn a video or audio file into an MP3.</div>'}</div>`;
  $('#conv').onclick = openConvert;
  document.querySelectorAll('[data-play]').forEach(b => b.onclick = () => playQueue(list.map(t => t.id), list.findIndex(t => t.id === b.dataset.play)));
  document.querySelectorAll('[data-menu]').forEach(b => b.onclick = () => trackMenu(b.dataset.menu));
}
function trackMenu(id) {
  const t = byId(id);
  openDlg(`<h2 style="margin-top:0">${esc(t.title)}</h2>
    <div style="display:grid;gap:8px"><button class="btn ghost" id="m-ren">Rename</button><button class="btn ghost" id="m-pl">Add to playlist</button>
    <button class="btn ghost" id="m-dl">Download MP3</button><button class="btn ghost" id="m-del" style="color:var(--danger)">Delete</button></div>`);
  $('#m-ren').onclick = () => openDlg(`<h2 style="margin-top:0">Rename</h2><label class="sub">Title</label><input type="text" id="n-t" value="${esc(t.title)}"><label class="sub">Artist</label><input type="text" id="n-a" value="${esc(t.artist)}"><button class="btn" id="n-ok">Save</button>`) || ($('#n-ok').onclick = async () => {
    t.title = $('#n-t').value.trim() || t.title; t.artist = $('#n-a').value.trim(); await dbPut(t); dlg.close(); toast('Renamed'); render(); });
  $('#m-pl').onclick = () => pickPlaylist(id);
  $('#m-dl').onclick = () => { downloadTrack(t); dlg.close(); };
  $('#m-del').onclick = async () => { if (!confirm('Delete this MP3?')) return; await dbDel(id); tracks = tracks.filter(x => x.id !== id); playlists.forEach(p => p.ids = p.ids.filter(x => x !== id)); save('playlists', playlists); dlg.close(); render(); };
}
function pickPlaylist(trackId) {
  openDlg(`<h2 style="margin-top:0">Add to playlist</h2>${playlists.map(p => `<button class="row" style="width:100%" data-p="${p.id}"><div class="meta t" style="text-align:left">${esc(p.name)}</div><span class="sub">${p.ids.length}</span></button>`).join('') || '<div class="empty">No playlists yet.</div>'}<button class="btn" id="np">+ New playlist</button>`);
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { const p = playlists.find(x => x.id === b.dataset.p); if (!p.ids.includes(trackId)) p.ids.push(trackId); save('playlists', playlists); dlg.close(); toast('Added to ' + p.name); });
  $('#np').onclick = () => { const n = prompt('Playlist name'); if (!n) return; playlists.push({ id: uid(), name: n.trim(), ids: [trackId] }); save('playlists', playlists); dlg.close(); toast('Playlist created'); };
}

/* ---------- PLAYLISTS ---------- */
function renderPlaylists() {
  if (openPlaylist) return renderPlaylistDetail();
  $('#view').innerHTML = `<div class="top"><div><h1>Playlists</h1><div class="sub">${playlists.length} playlist${playlists.length === 1 ? '' : 's'}</div></div><button class="btn sm" id="newp">+ New</button></div>
    <div style="margin-top:16px">${playlists.map(p => `<button class="row" style="width:100%;text-align:left" data-open="${p.id}"><div class="ico">☰</div><div class="meta"><div class="t">${esc(p.name)}</div><div class="a">${p.ids.filter(byId).length} tracks</div></div></button>`).join('') || '<div class="empty">Create a playlist, then add songs from your Library.</div>'}</div>`;
  $('#newp').onclick = () => { const n = prompt('Playlist name'); if (!n) return; playlists.push({ id: uid(), name: n.trim(), ids: [] }); save('playlists', playlists); render(); };
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { openPlaylist = b.dataset.open; render(); });
}
function renderPlaylistDetail() {
  const p = playlists.find(x => x.id === openPlaylist); if (!p) { openPlaylist = null; return render(); }
  const list = p.ids.map(byId).filter(Boolean);
  $('#view').innerHTML = `<button class="small" id="back">← All playlists</button>
    <div class="top" style="margin-top:14px"><div><h1>${esc(p.name)}</h1><div class="sub">${list.length} tracks</div></div><button class="btn sm" id="pa-all">▶ Play all</button></div>
    <div style="margin-top:16px">${list.map(t => rowHtml(t, `<button class="small" data-play="${t.id}">▶</button><button class="small" data-rm="${t.id}" aria-label="Remove">✕</button>`)).join('') || '<div class="empty">Empty. Add songs from the Library using the ⋯ menu.</div>'}</div>
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn ghost sm" id="rn">Rename</button><button class="btn ghost sm" id="dp" style="color:var(--danger)">Delete playlist</button></div>`;
  $('#back').onclick = () => { openPlaylist = null; render(); };
  $('#pa-all').onclick = () => playQueue(list.map(t => t.id));
  document.querySelectorAll('[data-play]').forEach(b => b.onclick = () => playQueue(list.map(t => t.id), list.findIndex(t => t.id === b.dataset.play)));
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { p.ids = p.ids.filter(x => x !== b.dataset.rm); save('playlists', playlists); render(); });
  $('#rn').onclick = () => { const n = prompt('New name', p.name); if (n) { p.name = n.trim(); save('playlists', playlists); render(); } };
  $('#dp').onclick = () => { if (confirm('Delete this playlist? Your MP3s stay in the Library.')) { playlists = playlists.filter(x => x !== p); save('playlists', playlists); openPlaylist = null; render(); } };
}

/* ---------- CONVERT (runs fully on your device; never downloads by itself) ---------- */
async function downloadTrack(t) {
  const name = ((t.artist ? t.artist + ' - ' : '') + t.title).replace(/[\\/:*?"<>|]+/g, '_') + '.mp3';
  const cap = window.Capacitor;
  if (cap && cap.isNativePlatform && cap.isNativePlatform()) {
    try {
      const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.onerror = rej; r.readAsDataURL(t.blob); });
      const f = await cap.Plugins.Filesystem.writeFile({ path: name, data: b64, directory: 'CACHE' });
      await cap.Plugins.Share.share({ title: name, url: f.uri });   // share sheet: choose "Save to device / Files"
    } catch (e) { toast('Could not save this file'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(t.blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const BLOCKED_SITES = /(^|\.)(youtube\.com|youtu\.be|spotify\.com|soundcloud\.com|apple\.com|deezer\.com|tidal\.com|tiktok\.com|instagram\.com|facebook\.com|fb\.watch|twitter\.com|x\.com|vimeo\.com|dailymotion\.com|twitch\.tv|bandcamp\.com|amazon\.[a-z.]+)$/i;
function openConvert(prefill) {
  let pending = [];
  openDlg(`<h2 style="margin-top:0">Convert to MP3</h2>
    <p class="sub">Choose video or audio files you own, a folder, or a direct link to a file. Conversion happens on this device. MP3s are saved to your Library and nothing downloads until you tap Download.</p>
    <label class="drop" for="file">Choose files<input id="file" type="file" accept="audio/*,video/*" multiple hidden></label>
    <label class="drop" for="folder">Choose a folder (convert a whole playlist)<input id="folder" type="file" webkitdirectory multiple hidden></label>
    <label class="sub">Or paste a link to an audio/video file</label>
    <div style="display:flex;gap:8px;margin-top:6px"><input type="text" id="lnk" placeholder="https://example.com/clip.mp4" inputmode="url" style="margin:0"><button class="btn sm" id="addlink">Add</button></div>
    <div id="lnkmsg" class="sub" style="margin:6px 0 12px"></div>
    <div id="picked" class="sub"></div>
    <label class="sub">Add to playlist</label>
    <select id="pl"><option value="">No playlist</option><option value="__new">New playlist…</option>${playlists.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
    <input type="text" id="plname" placeholder="Playlist name" style="display:none">
    <label class="sub">Quality</label>
    <select id="kbps"><option value="128">128 kbps (small)</option><option value="192" selected>192 kbps</option><option value="320">320 kbps (best)</option></select>
    <button class="btn" id="go" disabled>Convert</button>
    <div id="jobs" style="margin-top:14px"></div>`);
  const showPicked = () => { $('#picked').textContent = pending.length ? pending.length + ' file' + (pending.length > 1 ? 's' : '') + ' ready' : 'No audio or video files found.'; $('#go').disabled = !pending.length; };
  const pick = (files, folderName) => {
    pending = [...files].filter(f => /^(audio|video)\//.test(f.type)).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    showPicked();
    if (folderName && pending.length) { $('#pl').value = '__new'; $('#plname').style.display = 'block'; $('#plname').value = folderName; }
  };
  $('#file').onchange = e => pick(e.target.files);
  $('#folder').onchange = e => pick(e.target.files, e.target.files[0]?.webkitRelativePath.split('/')[0]);
  $('#pl').onchange = e => $('#plname').style.display = e.target.value === '__new' ? 'block' : 'none';
  $('#addlink').onclick = async () => {
    const msg = $('#lnkmsg'); let u;
    try { u = new URL($('#lnk').value.trim()); if (!/^https?:$/.test(u.protocol)) throw 0; } catch { return msg.textContent = 'That doesn’t look like a web link.'; }
    if (BLOCKED_SITES.test(u.hostname)) return msg.textContent = 'Links from streaming and video sites can’t be converted here. If it’s your own video, download the original file and use Choose files.';
    msg.textContent = 'Fetching…';
    try {
      const r = await fetch(u); if (!r.ok) throw 0;
      const ct = r.headers.get('content-type') || '';
      if (!/^(audio|video)\//.test(ct) && !/octet-stream/.test(ct)) return msg.textContent = 'That link is a web page, not an audio or video file.';
      const blob = await r.blob(), name = decodeURIComponent(u.pathname.split('/').pop() || '') || 'link-audio';
      pending.push(new File([blob], name, { type: blob.type })); $('#lnk').value = ''; msg.textContent = 'Added.'; showPicked();
    } catch { msg.textContent = 'Couldn’t fetch that link. The server may block other apps, or the link needs a login.'; }
  };
  $('#go').onclick = async () => {
    $('#go').disabled = true; const ids = [], kbps = +$('#kbps').value, target = $('#pl').value;
    for (const f of pending) { const t = await convertFile(f, kbps); if (t) ids.push(t.id); }
    if (ids.length && target) {
      let p = playlists.find(x => x.id === target);
      if (!p) { p = { id: uid(), name: $('#plname').value.trim() || 'New playlist', ids: [] }; playlists.push(p); }
      p.ids.push(...ids.filter(id => !p.ids.includes(id))); save('playlists', playlists);
      toast('Added ' + ids.length + ' to ' + p.name);
    }
    pending = []; $('#picked').textContent = ids.length + ' converted. Tap Download on any track to save it.'; render();
  };
  if (prefill) { $('#lnk').value = prefill; $('#addlink').click(); }
}
async function convertFile(file, kbps) {
  const job = document.createElement('div'); job.className = 'row'; job.style.display = 'block';
  job.innerHTML = `<div class="t" style="font-size:14px">${esc(file.name)}</div><div class="prog"><i></i></div><div class="sub st">Reading…</div>`;
  $('#jobs').append(job); const bar = $('i', job), st = $('.st', job);
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const audioBuf = await ctx.decodeAudioData(await file.arrayBuffer()); ctx.close();
    const ch = Math.min(2, audioBuf.numberOfChannels), rate = audioBuf.sampleRate;
    const enc = new lamejs.Mp3Encoder(ch, rate, kbps), parts = [], step = 1152 * 20;
    const to16 = f => { const o = new Int16Array(f.length); for (let i = 0; i < f.length; i++) { const v = Math.max(-1, Math.min(1, f[i])); o[i] = v < 0 ? v * 0x8000 : v * 0x7FFF; } return o; };
    const L = to16(audioBuf.getChannelData(0)), R = ch > 1 ? to16(audioBuf.getChannelData(1)) : null;
    st.textContent = 'Encoding…';
    for (let i = 0; i < L.length; i += step) {
      const out = ch > 1 ? enc.encodeBuffer(L.subarray(i, i + step), R.subarray(i, i + step)) : enc.encodeBuffer(L.subarray(i, i + step));
      if (out.length) parts.push(out);
      bar.style.width = (i / L.length * 100) + '%';
      if ((i / step) % 10 === 0) await new Promise(r => setTimeout(r));
    }
    const end = enc.flush(); if (end.length) parts.push(end);
    const blob = new Blob(parts, { type: 'audio/mpeg' });
    const t = { id: uid(), title: file.name.replace(/\.[^.]+$/, ''), artist: '', duration: audioBuf.duration, created: Date.now(), blob };
    await dbPut(t); tracks.push(t); bar.style.width = '100%'; st.textContent = 'Converted and saved to Library. ';
    const b = document.createElement('button'); b.className = 'small'; b.textContent = 'Download'; b.onclick = () => downloadTrack(t); st.append(b);
    return t;
  } catch (err) { st.textContent = 'Could not convert this file (unsupported format or too large for this device).'; st.style.color = 'var(--danger)'; return null; }
}

/* ---------- free photo reading (Tesseract OCR runs on the phone; the photo is never uploaded) ---------- */
let tessLoading = null;
const loadTesseract = () => window.Tesseract ? Promise.resolve() : (tessLoading = tessLoading || new Promise((res, rej) => {
  const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'; sc.onload = res; sc.onerror = () => rej(new Error('load')); document.head.append(sc); }));
const cleanLine = l => l.replace(/\b\d{1,2}:\d{2}\b/g, ' ').replace(/^[\s\d.)\-–•*]+/, '').replace(/[^\p{L}\p{N}&'’\- ]+/gu, ' ').replace(/\s+/g, ' ').trim();
async function readPhoto(file, out, onPick) {
  out.innerHTML = '<p class="sub">Loading the text reader (needs internet the first time)…</p>';
  try {
    await loadTesseract();
    const img = await toDataUrl(file, 1800, .92);
    const worker = await Tesseract.createWorker('eng', 1, { logger: m => { if (m.status === 'recognizing text') out.innerHTML = `<p class="sub">Reading the photo… ${Math.round(m.progress * 100)}%</p>`; } });
    const { data } = await worker.recognize(img); await worker.terminate();
    const lines = [...new Set(data.text.split('\n').map(cleanLine).filter(l => (l.match(/\p{L}/gu) || []).length >= 3))].slice(0, 40);
    if (!lines.length) { out.innerHTML = '<p class="sub">I couldn’t read any text. Try a clearer, closer photo.</p>'; return; }
    out.innerHTML = '<p class="sub">Tap a line to search for it. If something was misread, fix it in the search box above.</p>' + lines.map((l, k) => `<button class="row" style="width:100%;text-align:left" data-l="${k}"><div class="meta t">${esc(l)}</div><span class="small">Search</span></button>`).join('');
    out.querySelectorAll('[data-l]').forEach(b => b.onclick = () => onPick(lines[+b.dataset.l]));
  } catch { out.innerHTML = '<p class="sub" style="color:var(--danger)">Couldn’t read that photo. The text reader needs an internet connection the first time.</p>'; }
}

  Paper: { accent: '#5B4BE0', bg: '#F4F1EA', panel: '#FFFFFF', ink: '#1D1B26', amber: '#C77700' }
};
const DEFAULT_THEME = { ...THEMES.Violet, radius: 14, zoom: 100, font: '', dim: 35, blur: 0, cardOpacity: 100, density: 10, wall: '', css: '', hide: [] };
let theme = { ...DEFAULT_THEME, ...ls('theme', {}) };
const isLight = hex => { const n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) > 150; };
function applyTheme() {
  const r = document.documentElement.style, t = theme;
  r.setProperty('--accent', t.accent); r.setProperty('--bg', t.bg); r.setProperty('--ink', t.ink); r.setProperty('--amber', t.amber);
  r.setProperty('--panel', `color-mix(in srgb, ${t.panel} ${t.cardOpacity}%, transparent)`);
  r.setProperty('--panel2', `color-mix(in srgb, ${t.panel} 85%, ${t.ink})`);
  r.setProperty('--mute', `color-mix(in srgb, ${t.ink} 55%, ${t.bg})`);
  r.setProperty('--r', t.radius + 'px'); r.setProperty('--pad', t.density + 'px');
  r.fontFamily = t.font || ''; r.colorScheme = isLight(t.bg) ? 'light' : 'dark';
  document.body.style.zoom = t.zoom / 100;
  const w = $('#wall');
  w.style.backgroundImage = t.wall ? `linear-gradient(rgba(0,0,0,${t.dim / 100}),rgba(0,0,0,${t.dim / 100})), url(${t.wall})` : 'none';
  w.style.filter = t.blur ? `blur(${t.blur}px)` : 'none'; w.style.transform = t.blur ? 'scale(1.06)' : 'none';
  $('#usercss').textContent = t.css;
  document.querySelector('meta[name=theme-color]').content = t.bg;
}
function commitTheme() { try { save('theme', theme); } catch { toast('Not enough space to save that'); } applyTheme(); }
async function toDataUrl(file, max, q) {
  const bmp = await createImageBitmap(file), s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = bmp.width * s; c.height = bmp.height * s;
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', q);
}

    <label class="sub">Font</label>

    <h2>Advanced: your own CSS</h2>

    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="th-done">Done</button><button class="btn ghost" id="th-reset">Reset all</button></div>`);
  document.querySelectorAll('[data-th]').forEach(b => b.onclick = () => { theme = { ...theme, ...THEMES[b.dataset.th] }; commitTheme(); openCustomize(); });
  [['c-accent', 'accent'], ['c-bg', 'bg'], ['c-panel', 'panel'], ['c-ink', 'ink'], ['c-amber', 'amber']].forEach(([id, k]) => $('#' + id).oninput = e => { theme[k] = e.target.value; commitTheme(); });
  [['s-radius', 'radius'], ['s-zoom', 'zoom'], ['s-density', 'density'], ['s-card', 'cardOpacity'], ['s-dim', 'dim'], ['s-blur', 'blur']].forEach(([id, k]) => $('#' + id).oninput = e => { theme[k] = +e.target.value; $('#' + id + '-v').textContent = e.target.value; commitTheme(); });
  $('#f-font').value = t.font; $('#f-font').onchange = e => { theme.font = e.target.value; commitTheme(); };
  $('#wp').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { theme.wall = await toDataUrl(f, 1600, .8); commitTheme(); toast('Wallpaper set'); } catch { toast('Couldn’t use that image'); } };
  $('#wp-clear').onclick = () => { theme.wall = ''; commitTheme(); };
  document.querySelectorAll('[data-sec]').forEach(c => c.onchange = () => { theme.hide = [...document.querySelectorAll('[data-sec]')].filter(x => !x.checked).map(x => x.dataset.sec); commitTheme(); });
  $('#u-css').oninput = e => { theme.css = e.target.value; commitTheme(); };

/* ---------- links shared to the app ---------- */
function incomingLink() {
  const p = new URLSearchParams(location.search), m = (p.get('url') || p.get('text') || '').match(/https?:\/\/\S+/);
  if (m) history.replaceState(null, '', location.pathname); return m && m[0];
}

/* ---------- free & legal music search (Internet Archive + optional Jamendo) ---------- */
async function jget(url) { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); }
async function archiveSearch(query) {
  const terms = query.replace(/[^\p{L}\p{N} ]+/gu, ' ').split(/\s+/).filter(Boolean).slice(0, 6);
  if (!terms.length) return [];
  const ask = async join => (await jget('https://archive.org/advancedsearch.php?q=' + encodeURIComponent('(' + terms.join(join) + ') AND mediatype:audio') + '&fl[]=identifier&fl[]=title&fl[]=creator&rows=10&output=json')).response?.docs || [];
  let docs = await ask(' AND ');
  if (!docs.length) docs = await ask(' OR ');
  const lists = await Promise.all(docs.map(async doc => {
    try {
      const m = await jget('https://archive.org/metadata/' + encodeURIComponent(doc.identifier));
      const lic = m.metadata?.licenseurl || '';
      if (!/creativecommons\.org|publicdomain/i.test(lic)) return [];   // only openly licensed / public-domain items
      const creator = [].concat(doc.creator || []).join(', ');
      return (m.files || []).filter(f => /\.mp3$/i.test(f.name) && /mp3/i.test(f.format || '')).slice(0, 3).map(f => ({
        src: 'Internet Archive', license: lic, name: f.title || f.name.replace(/\.mp3$/i, ''), artist: f.creator || creator,
        url: 'https://archive.org/download/' + encodeURIComponent(doc.identifier) + '/' + f.name.split('/').map(encodeURIComponent).join('/') }));
    } catch { return []; }
  }));
  return lists.flat();
}
async function jamendoSearch(query, cid) {
  const d = await jget('https://api.jamendo.com/v3.0/tracks/?client_id=' + encodeURIComponent(cid) + '&format=json&limit=8&audiodownload_allowed=true&search=' + encodeURIComponent(query));
  return (d.results || []).filter(r => r.audiodownload).map(r => ({ src: 'Jamendo', license: r.license_ccurl || 'Creative Commons', url: r.audiodownload, name: r.name, artist: r.artist_name }));
}
/* ---------- PLAYTUBE: your own website (edit the two lines in the box) ---------- */
const PLAYTUBE = {
  searchUrl: 'https://playtube.example.com/search?q={q}',   // 1) CHANGE: your site's search address. {q} becomes what you typed
  resultSelector: 'a.result'                                // 2) CHANGE: CSS selector of the result links on that page (ignored if your site returns JSON)
};
async function playtubeSearch(query) {
  const url = PLAYTUBE.searchUrl.replace('{q}', encodeURIComponent(query));
  const res = await fetch(url); if (!res.ok) throw new Error(res.status);
  const text = await res.text(), mk = (u, name, artist) => ({ src: 'Playtube', license: 'My own site', url: u, name: name || 'Untitled', artist: artist || '' });
  if (/^\s*[\[{]/.test(text)) {                              // site answers with JSON
    let d = JSON.parse(text); d = Array.isArray(d) ? d : (d.results || d.items || []);
    return d.slice(0, 10).map(x => mk(x.url || x.audio || x.video, x.title || x.name, x.artist)).filter(c => c.url);
  }
  const doc = new DOMParser().parseFromString(text, 'text/html');   // site answers with a normal web page
  const links = [...doc.querySelectorAll(PLAYTUBE.resultSelector)].slice(0, 8);
  const out = await Promise.all(links.map(async a => {
    const page = new URL(a.getAttribute('href'), url).href, name = a.textContent.trim();
    if (/\.(mp3|m4a|mp4|webm)(\?|$)/i.test(page)) return mk(page, name);
    try {
      const d2 = new DOMParser().parseFromString(await (await fetch(page)).text(), 'text/html');
      const el = d2.querySelector('audio[src], audio source[src], video[src], video source[src], a[href$=".mp3"], a[href$=".mp4"]');
      const u = el && (el.getAttribute('src') || el.getAttribute('href'));
      return u ? mk(new URL(u, page).href, name) : null;
    } catch { return null; }
  }));
  return out.filter(Boolean);
}
async function addFree(c, it, btn) {
  btn.disabled = true; btn.textContent = 'Fetching…';
  try {
    const r = await fetch(c.url); if (!r.ok) throw 0;
    if (/zip|html|json/i.test(r.headers.get('content-type') || '')) throw 0;
    const raw = await r.blob(); if (raw.size < 20000) throw 0;
    if (/^video\//.test(raw.type)) {   // a video file: convert its sound to MP3
      const v = await convertFile(new File([raw], (c.name || 'video') + '.mp4', { type: raw.type }), 192); if (!v) throw 0;
      v.title = c.name || v.title; v.artist = c.artist || ''; await dbPut(v);
      btn.disabled = false; btn.textContent = 'Download MP3'; btn.onclick = () => downloadTrack(v); return;
    }
    const blob = new Blob([raw], { type: 'audio/mpeg' });
    const dur = await new Promise(res => { const a = new Audio(); a.preload = 'metadata'; a.onloadedmetadata = () => res(a.duration); a.onerror = () => res(0); a.src = URL.createObjectURL(blob); });
    const t = { id: uid(), title: c.name || it.title, artist: c.artist || it.artist || '', duration: dur || 0, created: Date.now(), blob };
    await dbPut(t); tracks.push(t); toast('Added to Library');
    btn.disabled = false; btn.textContent = 'Download MP3'; btn.onclick = () => downloadTrack(t);
  } catch { btn.disabled = false; btn.textContent = 'Couldn’t fetch it, try again'; }
}
function openSearch(prefill) {
  const cid = localStorage.getItem('jamendo') || '';
  openDlg(`<h2 style="margin-top:0">Find free music</h2>
    <p class="sub">Type a song, artist or album name. This searches free, legally shareable music only (Internet Archive${cid ? ' and Jamendo' : ''}). Chart songs from big labels won’t appear.</p>
    <div style="display:flex;gap:8px"><input type="text" id="sq" placeholder="Song or artist name" style="margin:0"><button class="btn sm" id="sgo">Search</button></div>
    <label class="drop" for="sph" style="margin:12px 0 0">📷 Or search from a photo (free, read on your phone)<input id="sph" type="file" accept="image/*" hidden></label>
    <div id="sres" style="margin-top:12px"></div><div id="sout" style="margin-top:14px"></div><div id="jobs" style="margin-top:10px"></div>
    ${cid ? '' : `<div class="sub" style="margin-top:14px">Optional: add a free Jamendo client ID (from devportal.jamendo.com) to search Jamendo too.<div style="display:flex;gap:8px;margin-top:6px"><input type="text" id="jid" placeholder="Jamendo client ID" style="margin:0"><button class="btn sm" id="jsave">Save</button></div></div>`}`);
  const run = async () => {
    const q = $('#sq').value.trim(); if (!q) return;
    const out = $('#sout'); out.innerHTML = '<p class="sub">Searching…</p>';
    let found = [], archiveFailed = false;
    try { found = await archiveSearch(q); } catch { archiveFailed = true; }
    if (cid) { try { found = found.concat(await jamendoSearch(q, cid)); } catch {} }
    try { found = found.concat(await playtubeSearch(q)); } catch {}
    if (!found.length) { out.innerHTML = `<p class="sub">${archiveFailed ? 'Couldn’t reach the search service. Check your internet connection.' : 'No free, legal MP3s found for that. Try a different spelling, or an independent artist.'}</p>`; return; }
    out.innerHTML = found.map((c, k) => `<div class="row" style="display:block"><div class="t" style="white-space:normal">${esc(c.name)}</div><div class="a">${esc(c.artist || 'Unknown artist')} · ${esc(c.src)} · ${esc(String(c.license).replace(/^https?:\/\//, ''))}</div><button class="btn sm" data-k="${k}" style="margin-top:8px">Add to Library</button></div>`).join('');
    out.querySelectorAll('button').forEach(b => { const c = found[+b.dataset.k]; b.onclick = () => addFree(c, { title: c.name, artist: c.artist }, b); });
  };
  $('#sgo').onclick = run; $('#sq').onkeydown = e => { if (e.key === 'Enter') run(); };
  $('#sph').onchange = e => { const f = e.target.files[0]; if (f) readPhoto(f, $('#sres'), line => { $('#sq').value = line; run(); }); };
  if (prefill) { $('#sq').value = prefill; run(); }
  if ($('#jsave')) $('#jsave').onclick = () => { const v = $('#jid').value.trim(); if (v) { localStorage.setItem('jamendo', v); openSearch(); } };
}

/* ---------- boot ---------- */
(async () => {
  tracks = await dbAll(); applyTheme(); render();
  if (navigator.storage?.persist) navigator.storage.persist();
  const link = incomingLink();
  if (link) { document.querySelector('[data-tab=library]').click(); openConvert(link); }
})();
